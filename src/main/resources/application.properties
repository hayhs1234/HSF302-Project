# ===================================================================
# StudyHub Application Configuration
# ===================================================================
server.port=8080
spring.application.name=StudyHub

# ===================================================================
# Microsoft SQL Server Database Configuration
# ===================================================================
# URL kết nối SQL Server (trustServerCertificate=true để bỏ qua SSL khi chạy local)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=StudyHubDB;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate & JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Thymeleaf Configuration
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ===================================================================
# File Upload Configuration
# ===================================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
studyhub.upload.dir=./uploads/
