# ===================================================================
# StudyHub Application Configuration
# ===================================================================
server.port=8080
spring.application.name=StudyHub

# ===================================================================
# Microsoft SQL Server Database Configuration
# ===================================================================
# URL kết nối SQL Server (trustServerCertificate=true để bỏ qua SSL khi chạy local)
spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=StudyHubDB;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=sa123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate & JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===================================================================
# Thymeleaf Configuration
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ===================================================================
# File Upload Configuration
# ===================================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
studyhub.upload.dir=./uploads/

studyhub.ai.gemini.api-key=${GEMINI_API_KEY:}
studyhub.ai.groq.api-key=${GROQ_API_KEY:}

# ===================================================================
# Đăng nhập với Google (OAuth2 / OpenID Connect)
# Để trống thì app vẫn chạy bình thường và ẩn nút "Đăng nhập với Google".
# Redirect URI cần khai báo trên Google Cloud Console:
#   http://localhost:8080/login/oauth2/code/google
# ===================================================================
studyhub.google.client-id=${GOOGLE_CLIENT_ID:}
studyhub.google.client-secret=${GOOGLE_CLIENT_SECRET:}
