<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <header th:fragment="header" class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
        <!-- App Title / Context Pill -->
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-primary-subtle text-primary border px-2 py-1">
                <i class="bi bi-mortarboard-fill me-1"></i> Học viện Tri thức số
            </span>
            <span class="text-secondary small d-none d-md-inline">|</span>
            <span class="text-secondary small d-none d-md-inline">Học liệu đa ngành</span>
        </div>

        <!-- Right action tools & User Profile -->
        <div class="d-flex align-items-center gap-2 ms-auto">
            <!-- Upload Button triggers Modal -->
            <button type="button" class="btn btn-primary rounded-pill px-3 py-2 d-flex align-items-center gap-2 shadow-sm"
                    data-bs-toggle="modal" data-bs-target="#uploadModal">
                <i class="bi bi-cloud-arrow-up-fill"></i>
                <span class="fw-semibold">Tải tài liệu lên</span>
            </button>

            <!-- User profile pill -->
            <div class="d-flex align-items-center gap-2 bg-white rounded-pill p-1 pe-3 border shadow-sm">
                <img th:if="${session.currentUser != null and session.currentUser.avatarUrl != null}"
                     th:src="${session.currentUser.avatarUrl}" alt="Ảnh đại diện" referrerpolicy="no-referrer"
                     class="rounded-circle" style="width: 36px; height: 36px; object-fit: cover;">
                <div th:unless="${session.currentUser != null and session.currentUser.avatarUrl != null}"
                     class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold text-uppercase"
                     style="width: 36px; height: 36px; font-size: 0.85rem;"
                     th:text="${session.currentUser != null ? session.currentUser.initials : 'SV'}">
                    SV
                </div>
                <div class="d-none d-sm-block text-start lh-1">
                    <div class="fw-semibold text-dark" style="font-size: 0.85rem;"
                         th:text="${session.currentUser != null ? session.currentUser.fullName : 'Sinh viên'}">
                        Sinh viên
                    </div>
                    <small class="text-muted" style="font-size: 0.72rem;"
                           th:text="${session.currentUser != null ? session.currentUser.email : 'Thành viên'}">
                        student@gmail.com
                    </small>
                </div>
            </div>

            <!-- Logout Button -->
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-danger rounded-pill px-3 py-2 d-flex align-items-center gap-1 shadow-sm" title="Đăng xuất khỏi hệ thống">
                    <i class="bi bi-box-arrow-right"></i>
                    <span class="d-none d-md-inline fw-semibold small">Đăng xuất</span>
                </button>
            </form>
        </div>
    </header>
</body>
</html>
