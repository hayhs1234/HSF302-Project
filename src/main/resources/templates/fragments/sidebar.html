<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="sidebar(activeTab)" class="sidebar">
        <div>
            <!-- Logo Brand -->
            <div class="d-flex align-items-center justify-content-between mb-4 px-2">
                <a th:href="@{/}" class="brand-logo">
                    <i class="bi bi-mortarboard-fill text-primary fs-3"></i>
                    <div>
                        <div class="fw-bold text-dark lh-1">StudyHub</div>
                        <span class="brand-badge">Học viện tri thức</span>
                    </div>
                </a>
            </div>

            <!-- Menu Navigation -->
            <div class="nav flex-column">
                <div class="text-uppercase text-muted fw-bold px-3 mb-2" style="font-size: 0.72rem; letter-spacing: 0.08em;">
                    Không gian học tập
                </div>

                <a th:href="@{/dashboard}" class="nav-link-custom" th:classappend="${activeTab == 'dashboard'} ? ' active' : ''">
                    <i class="bi bi-grid-1x2"></i>
                    <span>Tổng quan</span>
                </a>

                <a th:href="@{/ai/chat}" class="nav-link-custom" th:classappend="${activeTab == 'ai-chat'} ? ' active' : ''">
                    <i class="bi bi-robot"></i>
                    <span>Trợ lý AI</span>
                    <span class="badge bg-primary text-white ms-auto" style="font-size: 0.65rem;">AI</span>
                </a>

                <a th:href="@{/shared-documents}" class="nav-link-custom" th:classappend="${activeTab == 'shared-docs'} ? ' active' : ''">
                    <i class="bi bi-share"></i>
                    <span>Tài liệu chia sẻ</span>
                </a>

                <a th:href="@{/subjects}" class="nav-link-custom" th:classappend="${activeTab == 'subjects'} ? ' active' : ''">
                    <i class="bi bi-book"></i>
                    <span>Môn học / Học phần</span>
                </a>

                <a th:href="@{/favorites}" class="nav-link-custom" th:classappend="${activeTab == 'favorites'} ? ' active' : ''">
                    <i class="bi bi-star"></i>
                    <span>Đã đánh dấu sao</span>
                </a>

                <a th:href="@{/}" class="nav-link-custom text-secondary" title="Về trang giới thiệu">
                    <i class="bi bi-house-door"></i>
                    <span>Trang giới thiệu</span>
                </a>

                <a th:href="@{/logout}" class="nav-link-custom text-danger mt-2" title="Đăng xuất khỏi hệ thống">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Đăng xuất</span>
                </a>
            </div>
        </div>

        <!-- Storage & Support footer -->
        <div class="pt-3 border-top">

<!--                </div>-->
<!--                <div class="d-flex justify-content-between small text-muted mt-2" style="font-size: 0.75rem;">-->

            <div class="px-2 small text-muted d-flex justify-content-between">
                <span><i class="bi bi-shield-check text-success me-1"></i> StudyHub v1.0</span>
            </div>
        </div>
    </div>
</body>
</html>
