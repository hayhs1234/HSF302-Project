<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Chỉnh sửa tài liệu - StudyHub' : 'Thêm mới tài liệu - StudyHub'">Quản lý tài liệu - StudyHub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Left Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar(activeTab='my-docs')}"></div>

    <!-- Main Content Container -->
    <div class="main-content">
        <!-- Top Header -->
        <div th:replace="~{fragments/header :: header}"></div>

        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">StudyHub</a></li>
                        <li class="breadcrumb-item active" aria-current="page" th:text="${isEdit} ? 'Chỉnh sửa tài liệu' : 'Thêm tài liệu mới'"></li>
                    </ol>
                </nav>
                <h3 class="fw-bold mb-0 text-dark" th:text="${isEdit} ? 'Chỉnh sửa tài liệu' : 'Tải lên tài liệu học tập mới'"></h3>
            </div>
            <a th:href="@{/}" class="btn btn-outline-secondary rounded-pill px-3">
                <i class="bi bi-arrow-left me-1"></i> Quay lại trang chủ
            </a>
        </div>

        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
                <!-- Validation Summary Alert -->
                <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <strong>Vui lòng kiểm tra lại thông tin:</strong> Có một số trường dữ liệu chưa hợp lệ.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/documents/save}" th:object="${documentDto}" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:field="*{id}" th:if="${isEdit}">

                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label fw-semibold">Tên tài liệu <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{title}"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
                                   placeholder="Ví dụ: Giao_trinh_Giai_thuat_Nang_cao.pdf" required>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Môn học / Học phần <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{subjectId}"
                                    th:classappend="${#fields.hasErrors('subjectId')} ? 'is-invalid' : ''" required>
                                <option value="">-- Chọn môn học --</option>
                                <option th:each="sub : ${subjects}" th:value="${sub.id}"
                                        th:text="${sub.code + ' - ' + sub.name}"></option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('subjectId')}" th:errors="*{subjectId}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Phân loại tài liệu <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{category}"
                                    th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''" required>
                                <option value="Giáo trình & Bài giảng">Giáo trình & Bài giảng</option>
                                <option value="Đề thi & Đáp án">Đề thi & Đáp án</option>
                                <option value="Slide thuyết trình">Slide thuyết trình</option>
                                <option value="Ghi chú & Khác">Ghi chú & Khác</option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Tác giả / Giảng viên phụ trách</label>
                            <input type="text" class="form-control" th:field="*{author}"
                                   placeholder="Ví dụ: PGS. TS. Trần Hùng">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Định dạng file (khi tạo không có file vật lý)</label>
                            <select class="form-select" th:field="*{fileExtension}">
                                <option value="PDF">PDF</option>
                                <option value="DOCX">DOCX</option>
                                <option value="PPTX">PPTX</option>
                                <option value="ZIP">ZIP</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Tệp đính kèm (tùy chọn)</label>
                            <input type="file" class="form-control" th:field="*{file}">
                            <div class="form-text">Hỗ trợ PDF, DOCX, PPTX, ZIP, v.v. Tối đa 50MB.</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Đường dẫn URL tài liệu (Google Drive, OneDrive, bài viết...)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-link-45deg"></i></span>
                                <input type="url" class="form-control" th:field="*{fileUrl}"
                                       th:classappend="${#fields.hasErrors('fileUrl')} ? 'is-invalid' : ''"
                                       placeholder="https://drive.google.com/... hoặc https://...">
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('fileUrl')}" th:errors="*{fileUrl}"></div>
                            <div class="form-text">Liên kết trực tiếp tới tài liệu học tập để người dùng có thể mở trực tuyến (bắt đầu bằng http:// hoặc https://).</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Thẻ từ khóa / Hashtags</label>
                            <input type="text" class="form-control" th:field="*{tags}"
                                   placeholder="Ví dụ: #ThuatToan #DoThi #DoPhucTap #QuyHoachDong">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Mô tả tóm tắt nội dung</label>
                            <textarea class="form-control" rows="4" th:field="*{description}"
                                      placeholder="Mô tả nội dung trọng tâm của tài liệu..."></textarea>
                        </div>

                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" th:field="*{isFavorite}" id="isFav">
                                <label class="form-check-label fw-medium" for="isFav">
                                    Đánh dấu sao (Thêm vào danh sách yêu thích)
                                </label>
                            </div>
                        </div>

                        <div class="col-12 mt-4 pt-3 border-top d-flex gap-2">
                            <button type="submit" class="btn btn-primary rounded-pill px-4">
                                <i class="bi bi-save me-1"></i> Lưu tài liệu
                            </button>
                            <a th:href="@{/}" class="btn btn-light border rounded-pill px-4">Hủy bỏ</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/csrf.js}"></script>
</body>
</html>
