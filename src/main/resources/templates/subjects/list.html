<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Môn học & Học phần - StudyHub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Left Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar(activeTab='subjects')}"></div>

    <!-- Main Content Container -->
    <div class="main-content">
        <!-- Top Header -->
        <div th:replace="~{fragments/header :: header}"></div>

        <!-- Alert messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-3 shadow-sm mb-4" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-3 shadow-sm mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
            <div>
                <h3 class="fw-bold mb-1 text-dark">Danh mục Môn học / Học phần</h3>
                <p class="text-secondary mb-0">Các môn học được phân chia theo chương trình đào tạo khoa Công nghệ Thông tin.</p>
            </div>
            <button type="button" class="btn btn-primary rounded-pill px-3 shadow-sm"
                    data-bs-toggle="modal" data-bs-target="#newSubjectModal">
                <i class="bi bi-plus-lg me-1"></i> Thêm môn học mới
            </button>
        </div>

        <!-- Subjects Grid -->
        <div class="row g-3">
            <div th:each="sub : ${subjects}" class="col-md-6 col-lg-4">
                <div class="doc-card">
                    <div>
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <div class="stat-icon" th:style="'background-color: ' + ${sub.color} + '15; color: ' + ${sub.color}">
                                <i class="bi" th:classappend="${sub.icon}"></i>
                            </div>
                            <span class="badge bg-light text-dark border fw-bold" th:text="${sub.code}"></span>
                        </div>
                        <h5 class="fw-bold mb-2">
                            <a th:href="@{/(subjectId=${sub.id})}" class="text-decoration-none text-dark" th:text="${sub.name}"></a>
                        </h5>
                        <p class="text-secondary small mb-3" style="min-height: 40px;" th:text="${sub.description}"></p>
                    </div>

                    <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                        <span class="small text-muted">
                            <i class="bi bi-file-earmark-text me-1"></i>
                            <span th:text="${sub.documentCount} + ' tài liệu'"></span>
                        </span>
                        <a th:href="@{/(subjectId=${sub.id})}" class="btn btn-sm btn-outline-primary rounded-pill px-3">
                            Xem tài liệu <i class="bi bi-arrow-right ms-1"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Thêm Môn học -->
    <div class="modal fade" id="newSubjectModal" tabindex="-1" aria-labelledby="newSubjectModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-bottom">
                    <h5 class="modal-title fw-bold" id="newSubjectModalLabel">
                        <i class="bi bi-book-half text-primary me-2"></i> Thêm môn học mới
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/subjects/save}" th:object="${newSubject}" method="post">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Mã môn học <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{code}" placeholder="Ví dụ: PRJ301, CSDL, CTDL-GT" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Tên môn học <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{name}" placeholder="Ví dụ: Lập trình Java Web" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Mô tả ngắn</label>
                            <textarea class="form-control" rows="3" th:field="*{description}" placeholder="Mô tả nội dung môn học..."></textarea>
                        </div>
                        <div class="row g-2">
                            <div class="col-6">
                                <label class="form-label fw-semibold small">Màu đại diện</label>
                                <input type="color" class="form-control form-control-color w-100" th:field="*{color}" value="#0d6efd">
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-semibold small">Icon biểu trưng</label>
                                <select class="form-select" th:field="*{icon}">
                                    <option value="bi-book">Sách</option>
                                    <option value="bi-diagram-3">Đồ thị / Cấu trúc</option>
                                    <option value="bi-database">Cơ sở dữ liệu</option>
                                    <option value="bi-code-slash">Code</option>
                                    <option value="bi-hdd-network">Mạng</option>
                                    <option value="bi-cpu">Phần cứng / CPU</option>
                                    <option value="bi-calculator">Toán</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-top bg-light">
                        <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Đóng</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-4">Lưu môn học</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/csrf.js}"></script>
</body>
</html>
