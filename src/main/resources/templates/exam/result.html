<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả bài thi - StudyHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/exam.css}">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar(activeTab='exam')}"></div>

<div class="main-content">
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Tổng kết điểm -->
    <div class="exam-card p-4 mb-4">
        <div class="row g-4 align-items-center">
            <div class="col-md-auto text-center">
                <div class="score-ring"
                     th:style="${'--pct:' + attempt.scorePercent}"
                     th:classappend="${attempt.score >= 8} ? 'good' : (${attempt.score >= 5} ? 'ok' : 'bad')">
                    <div>
                        <div class="score-ring-value" th:text="${attempt.formattedScore}">8.0</div>
                        <div class="score-ring-label">/ 10 điểm</div>
                    </div>
                </div>
            </div>
            <div class="col-md">
                <span class="badge mb-2" th:classappend="${attempt.examMode} ? 'bg-primary-subtle text-primary' : 'bg-secondary-subtle text-secondary'"
                      th:text="${attempt.examMode} ? 'Thi thử có tính giờ' : 'Quiz luyện nhanh'">Thi thử</span>
                <h4 class="fw-bold mb-1" th:text="${attempt.title}">Đề thi</h4>
                <p class="text-secondary mb-3">
                    <i class="bi bi-file-earmark-text me-1"></i><span th:text="${attempt.documentTitle}">Tài liệu</span> ·
                    Mức độ <span th:text="${attempt.difficultyLabel}">Trung bình</span> ·
                    <span th:text="${attempt.formattedStartedAt}">--</span>
                </p>
                <p class="fw-semibold mb-3" th:text="${attempt.scorePercent >= 90} ? 'Xuất sắc! Bạn đã nắm vững kiến thức trọng tâm.'
                        : (${attempt.scorePercent >= 70} ? 'Khá tốt! Xem lại vài câu sai bên dưới là ổn.'
                        : (${attempt.scorePercent >= 50} ? 'Đạt yêu cầu. Hãy ôn lại các câu sai để chắc kiến thức hơn.'
                        : 'Cần ôn tập thêm. Đọc lại tài liệu hoặc hỏi Trợ lý AI về các phần chưa rõ nhé.'))">Nhận xét</p>
                <div class="d-flex flex-wrap gap-2">
                    <span class="result-chip text-success"><i class="bi bi-check-circle-fill"></i> <b th:text="${attempt.correctCount}">0</b> đúng</span>
                    <span class="result-chip text-danger"><i class="bi bi-x-circle-fill"></i> <b th:text="${attempt.wrongCount}">0</b> sai</span>
                    <span class="result-chip text-secondary"><i class="bi bi-dash-circle"></i> <b th:text="${attempt.blankCount}">0</b> bỏ trống</span>
                    <span th:if="${attempt.examMode}" class="result-chip"><i class="bi bi-stopwatch"></i> <span th:text="${attempt.formattedTimeSpent}">--</span></span>
                    <span th:if="${attempt.examMode and attempt.tabSwitchCount != null and attempt.tabSwitchCount > 0}" class="result-chip text-warning-emphasis">
                        <i class="bi bi-eye-slash"></i> Rời tab <b th:text="${attempt.tabSwitchCount}">0</b> lần
                    </span>
                </div>
            </div>
            <div class="col-md-auto d-flex flex-column gap-2">
                <a th:href="@{/exam(docId=${attempt.documentId})}" class="btn btn-primary rounded-pill px-4">
                    <i class="bi bi-arrow-repeat me-1"></i> Làm đề mới
                </a>
                <a th:href="@{/exam/history}" class="btn btn-outline-secondary rounded-pill px-4">
                    <i class="bi bi-graph-up-arrow me-1"></i> Thống kê
                </a>
            </div>
        </div>
    </div>

    <!-- Bộ lọc xem lại -->
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
        <h5 class="fw-bold mb-0">Xem lại bài làm</h5>
        <div class="btn-group btn-group-sm" role="group">
            <button type="button" class="btn btn-outline-primary active" onclick="filterReview('all', this)">Tất cả</button>
            <button type="button" class="btn btn-outline-primary" onclick="filterReview('wrong', this)">Chỉ câu sai / bỏ trống</button>
        </div>
    </div>

    <div th:each="q : ${attempt.questions}" class="question-card review"
         th:classappend="${q.correct == true} ? 'is-correct' : 'is-wrong'">
        <div class="d-flex align-items-start justify-content-between gap-2 mb-3">
            <div class="d-flex gap-2">
                <span class="q-number" th:text="${q.questionOrder}">1</span>
                <div class="fw-semibold q-text" th:text="${q.questionText}">Câu hỏi</div>
            </div>
            <span th:if="${q.correct == true}" class="badge bg-success-subtle text-success border"><i class="bi bi-check-lg me-1"></i>Đúng</span>
            <span th:if="${q.correct == false}" class="badge bg-danger-subtle text-danger border"><i class="bi bi-x-lg me-1"></i>Sai</span>
            <span th:if="${q.correct == null}" class="badge bg-secondary-subtle text-secondary border">Bỏ trống</span>
        </div>
        <div class="d-flex flex-column gap-2 mb-3">
            <div th:each="opt, st : ${q.options}" class="option-label static"
                 th:classappend="${st.index == q.correctIndex} ? 'correct' : ((${q.selectedIndex != null and q.selectedIndex == st.index}) ? 'chosen-wrong' : '')">
                <span class="option-letter" th:text="${ {'A','B','C','D','E','F'}[st.index] }">A</span>
                <span class="option-text flex-fill" th:text="${opt}">Phương án</span>
                <span th:if="${q.selectedIndex != null and q.selectedIndex == st.index}" class="small fw-semibold">Bạn chọn</span>
            </div>
        </div>
        <div class="explain-box">
            <div class="fw-semibold mb-1"><i class="bi bi-lightbulb-fill text-warning me-1"></i>Giải thích</div>
            <div class="text-secondary" th:text="${q.explanation != null and !#strings.isEmpty(q.explanation)} ? ${q.explanation} : 'Không có giải thích chi tiết.'">Giải thích</div>
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mt-2 pt-2 border-top small">
                <span class="text-muted"><i class="bi bi-bookmark me-1"></i><span th:text="${q.sourceReference}">Nguồn</span></span>
                <a th:if="${q.correct != true}"
                   th:href="@{/ai/chat(docId=${attempt.documentId})}"
                   class="text-decoration-none fw-semibold">
                    <i class="bi bi-robot me-1"></i>Hỏi Trợ lý AI về phần này
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/csrf.js}"></script>
<script>
    function filterReview(mode, btn) {
        document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.question-card.review').forEach(card => {
            card.style.display = (mode === 'wrong' && card.classList.contains('is-correct')) ? 'none' : '';
        });
    }
</script>
</body>
</html>
