<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang làm bài - StudyHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/exam.css}">
</head>
<body class="exam-room-body">

<!-- Thanh trạng thái phòng thi -->
<header class="exam-topbar">
    <div class="d-flex align-items-center gap-3 min-w-0">
        <i class="bi bi-mortarboard-fill text-primary fs-4"></i>
        <div class="min-w-0">
            <div class="fw-bold text-truncate" th:text="${attempt.title}">Đề thi</div>
            <small class="text-muted text-truncate d-block">
                <span th:text="${attempt.documentTitle}">Tài liệu</span> ·
                <span th:text="${attempt.difficultyLabel}">Trung bình</span> ·
                <span th:text="${attempt.totalQuestions + ' câu'}">10 câu</span>
            </small>
        </div>
    </div>
    <div class="d-flex align-items-center gap-3">
        <div class="answered-pill d-none d-sm-flex">
            <i class="bi bi-check2-square"></i>
            <span><b id="answeredCount" th:text="${attempt.answeredCount}">0</b>/<span th:text="${attempt.totalQuestions}">10</span></span>
        </div>
        <div id="timerBox" class="timer-box">
            <i class="bi bi-stopwatch"></i>
            <span id="timerText">--:--</span>
        </div>
        <button type="button" class="btn btn-primary rounded-pill px-3 fw-semibold" onclick="openSubmitConfirm()">
            <i class="bi bi-send-check me-1"></i>Nộp bài
        </button>
    </div>
</header>
<div class="exam-progress"><div id="timeProgress" class="exam-progress-bar"></div></div>

<div class="exam-layout">
    <!-- Danh sách câu hỏi -->
    <form id="examForm" th:action="@{/exam/{id}/submit(id=${attempt.id})}" method="post" class="exam-questions">
        <input type="hidden" name="tabSwitches" id="tabSwitchesInput" value="0">

        <div th:each="q : ${attempt.questions}" class="question-card" th:id="${'qcard_' + q.questionOrder}">
            <div class="d-flex align-items-start justify-content-between gap-2 mb-3">
                <div class="d-flex gap-2">
                    <span class="q-number" th:text="${q.questionOrder}">1</span>
                    <div class="fw-semibold q-text" th:text="${q.questionText}">Câu hỏi</div>
                </div>
                <button type="button" class="btn btn-sm flag-btn" th:attr="data-order=${q.questionOrder}"
                        onclick="toggleFlag(this)" title="Đánh dấu để xem lại">
                    <i class="bi bi-flag"></i>
                </button>
            </div>
            <div class="d-flex flex-column gap-2">
                <label th:each="opt, st : ${q.options}" class="option-label">
                    <input type="radio" class="option-input"
                           th:name="${'q_' + q.questionOrder}" th:value="${st.index}"
                           th:checked="${q.selectedIndex != null and q.selectedIndex == st.index}"
                           th:attr="data-order=${q.questionOrder}">
                    <span class="option-letter" th:text="${ {'A','B','C','D','E','F'}[st.index] }">A</span>
                    <span class="option-text" th:text="${opt}">Phương án</span>
                </label>
            </div>
        </div>

        <div class="text-center py-4">
            <button type="button" class="btn btn-primary btn-lg rounded-pill px-5 fw-semibold shadow-sm" onclick="openSubmitConfirm()">
                <i class="bi bi-send-check me-1"></i> Nộp bài
            </button>
        </div>
    </form>

    <!-- Bảng điều hướng câu hỏi -->
    <aside class="exam-navigator">
        <div class="fw-bold mb-2">Danh sách câu</div>
        <div class="nav-grid">
            <a th:each="q : ${attempt.questions}" th:href="${'#qcard_' + q.questionOrder}"
               class="nav-cell" th:id="${'nav_' + q.questionOrder}"
               th:classappend="${q.selectedIndex != null} ? 'answered' : ''"
               th:text="${q.questionOrder}">1</a>
        </div>
        <div class="nav-legend mt-3">
            <span><i class="legend-dot answered"></i>Đã làm</span>
            <span><i class="legend-dot"></i>Chưa làm</span>
            <span><i class="legend-dot flagged"></i>Xem lại</span>
        </div>
        <div id="saveStatus" class="small text-muted mt-3"><i class="bi bi-cloud-check me-1"></i>Bài làm được tự động lưu</div>
        <div id="tabWarning" class="tab-warning d-none mt-3">
            <i class="bi bi-eye-slash me-1"></i>Bạn đã rời tab <b id="tabSwitchCount">0</b> lần
        </div>
    </aside>
</div>

<!-- Xác nhận nộp bài -->
<div class="modal fade" id="submitModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow">
            <div class="modal-body p-4 text-center">
                <i class="bi bi-send-check text-primary" style="font-size: 2.5rem;"></i>
                <h5 class="fw-bold mt-2">Nộp bài thi?</h5>
                <p id="submitSummary" class="text-secondary mb-0"></p>
            </div>
            <div class="modal-footer border-0 justify-content-center pb-4">
                <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Làm tiếp</button>
                <button type="button" class="btn btn-primary rounded-pill px-4" onclick="submitExam()">Nộp bài</button>
            </div>
        </div>
    </div>
</div>

<!-- Hết giờ -->
<div id="timeUpOverlay" class="generating-overlay d-none">
    <div class="generating-box">
        <i class="bi bi-alarm text-danger" style="font-size: 3rem;"></i>
        <h5 class="fw-bold mt-2 mb-1">Hết giờ làm bài!</h5>
        <p class="text-secondary mb-0">Hệ thống đang tự động nộp bài của bạn...</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/csrf.js}"></script>
<script th:inline="javascript">
    const attemptId = /*[[${attempt.id}]]*/ 0;
    const totalQuestions = /*[[${attempt.totalQuestions}]]*/ 0;
    const durationSeconds = /*[[${attempt.durationSeconds}]]*/ 600;
    let remaining = /*[[${attempt.remainingSeconds}]]*/ 600;
    const deadlineAt = Date.now() + remaining * 1000;
    let submitting = false;
    let tabSwitches = 0;

    // ===== Đồng hồ đếm ngược (tính theo mốc thời gian thực, không lệch khi tab bị treo) =====
    function renderTimer() {
        remaining = Math.max(0, Math.round((deadlineAt - Date.now()) / 1000));
        const m = Math.floor(remaining / 60);
        const s = remaining % 60;
        document.getElementById('timerText').textContent =
            String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        const box = document.getElementById('timerBox');
        box.classList.toggle('warning', remaining <= 120 && remaining > 30);
        box.classList.toggle('danger', remaining <= 30);
        if (durationSeconds) {
            const used = 100 - (remaining / durationSeconds) * 100;
            document.getElementById('timeProgress').style.width = Math.min(100, Math.max(0, used)) + '%';
        }
        if (remaining === 0 && !submitting) {
            document.getElementById('timeUpOverlay').classList.remove('d-none');
            setTimeout(submitExam, 1200);
        }
    }
    renderTimer();
    setInterval(renderTimer, 500);

    // ===== Chọn đáp án + tự động lưu =====
    document.querySelectorAll('.option-input').forEach(function (input) {
        input.addEventListener('change', function () {
            const order = parseInt(this.dataset.order, 10);
            document.getElementById('nav_' + order).classList.add('answered');
            updateAnsweredCount();
            autosave(order, parseInt(this.value, 10));
        });
    });

    function updateAnsweredCount() {
        const count = document.querySelectorAll('.option-input:checked').length;
        document.getElementById('answeredCount').textContent = count;
        return count;
    }

    function autosave(order, selected) {
        const status = document.getElementById('saveStatus');
        status.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Đang lưu...';
        fetch('/api/exam/' + attemptId + '/answer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order: order, selected: selected })
        })
            .then(r => r.json())
            .then(d => {
                status.innerHTML = d.success
                    ? '<i class="bi bi-cloud-check me-1 text-success"></i>Đã lưu câu ' + order
                    : '<i class="bi bi-exclamation-circle me-1 text-warning"></i>Chưa lưu được (sẽ gửi khi nộp bài)';
            })
            .catch(() => {
                status.innerHTML = '<i class="bi bi-wifi-off me-1 text-warning"></i>Mất kết nối, đáp án vẫn được gửi khi nộp bài';
            });
    }

    function toggleFlag(btn) {
        const order = btn.dataset.order;
        btn.classList.toggle('active');
        document.getElementById('nav_' + order).classList.toggle('flagged');
    }

    // ===== Giám sát rời tab =====
    document.addEventListener('visibilitychange', function () {
        if (document.hidden && !submitting) {
            tabSwitches++;
            document.getElementById('tabSwitchesInput').value = tabSwitches;
            document.getElementById('tabSwitchCount').textContent = tabSwitches;
            document.getElementById('tabWarning').classList.remove('d-none');
        }
    });

    window.addEventListener('beforeunload', function (e) {
        if (!submitting) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    // ===== Nộp bài =====
    function openSubmitConfirm() {
        const answered = updateAnsweredCount();
        const blank = totalQuestions - answered;
        const flagged = document.querySelectorAll('.nav-cell.flagged').length;
        let text = 'Bạn đã làm ' + answered + '/' + totalQuestions + ' câu.';
        if (blank > 0) text += ' Còn ' + blank + ' câu chưa chọn đáp án.';
        if (flagged > 0) text += ' Có ' + flagged + ' câu đang đánh dấu xem lại.';
        document.getElementById('submitSummary').textContent = text;
        bootstrap.Modal.getOrCreateInstance(document.getElementById('submitModal')).show();
    }

    function submitExam() {
        if (submitting) return;
        submitting = true;
        document.getElementById('examForm').submit();
    }
</script>
</body>
</html>
